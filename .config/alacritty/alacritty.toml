[cursor]
unfocused_hollow = true

[cursor.style]
blinking = "Never"

[env]
TERM = "xterm-256color"

[font]
size = 14

[font.glyph_offset]
y = 1

[font.normal]
family = "Cascadia Mono NF"
style = "Regular"

[scrolling]
# auto_scroll = true
history = 2000

[window]
decorations = "None"
opacity = 1
option_as_alt = "Both"

[window.dimensions]
columns = 120
lines = 40

[window.padding]
x = 5
y = 5

[general]
import = [
    "~/.config/alacritty/themes/catppuccin_mocha.toml"
]
